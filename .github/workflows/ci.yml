name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (packages, hub, web)
        run: pnpm run typecheck
      - name: Tests (hub smoke + unit scripts, no local ASR)
        run: pnpm --filter @promedia/hub test -- --ci
      - name: Build
        run: pnpm run build
